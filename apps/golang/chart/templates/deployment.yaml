apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "golang.fullname" . }}
  labels:
    {{- include "golang.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "golang.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "golang.selectorLabels" . | nindent 8 }}
        environment: {{ .Values.environment | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: golang
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: p12
              mountPath: /app/file.p12
              subPath: {{ .Values.fileP12ConfigMap.key }}
              readOnly: true
      volumes:
        - name: p12
          configMap:
            name: {{ include "golang.fullname" . }}-file-p12
            items:
              - key: {{ .Values.fileP12ConfigMap.key }}
                path: {{ .Values.fileP12ConfigMap.key }}
