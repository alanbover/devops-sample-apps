name: Reusable container build and publish

on:
  workflow_call:
    inputs:
      build_context:
        description: Path to the app's Docker build context
        required: true
        type: string
      image_name:
        description: GHCR package name for the app image
        required: true
        type: string
      release_version:
        description: Semantic version to use as an image tag
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ inputs.image_name }}-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
          tags: |
            type=raw,value=${{ inputs.release_version }}
            type=ref,event=branch
            type=sha,format=long,prefix=sha-
          # https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-container-registry
          # to ensure your GITHUB_TOKEN has appropriate permissions when using a GitHub Actions workflow, we recommend adding the label org.opencontainers.image.source to your Dockerfile
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.build_context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
